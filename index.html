<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 魔方</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="panel">
        <div id="progress"></div>
        <div id="hint"></div>
        <div id="tools">
          <label for="scramble-steps">打乱步数</label>
          <input id="scramble-steps" type="number" min="1" max="30" step="1" value="20" />
          <button id="scramble" type="button">打乱</button>
          <button id="reset" type="button">重置</button>
          <button id="restore" type="button">一键复原</button>
          <button id="step-backward" type="button">上一步</button>
          <button id="step-forward" type="button">下一步</button>
          <button id="exit-restore" type="button">退出复原模式</button>
        </div>
        <div id="moves"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
